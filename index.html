<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototipo interactivo de Elecpro para controlar proyectos, cotizaciones, cartera, gastos y rentabilidad.">
  <title>Elecpro – Control de Proyectos</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
  <style>html,body{margin:0;min-height:100%;background:#f3f7f5}body{padding:18px}@media(max-width:640px){body{padding:0}}</style>
</head>
<body>
<div id="elecpro-project-control">
  <style>
    #elecpro-project-control {
      color-scheme: light dark;
      --ep-green-950: light-dark(#0c3f37, #d8fff4);
      --ep-green-900: light-dark(#124f45, #b8f2e3);
      --ep-green-800: light-dark(#176458, #83d7c4);
      --ep-green-700: light-dark(#1b7465, #5ec4ad);
      --ep-green-100: light-dark(#dff3ed, #153d35);
      --ep-green-50: light-dark(#eff9f5, #0f2924);
      --ep-shell: light-dark(#f3f7f5, #07130f);
      --ep-surface: light-dark(#ffffff, #0e1f1a);
      --ep-surface-raised: light-dark(#ffffff, #142923);
      --ep-text: light-dark(#17231f, #ecf8f4);
      --ep-muted: light-dark(#68766f, #9eb5ad);
      --ep-line: light-dark(#dce6e1, #29463d);
      --ep-warning: light-dark(#a55b05, #ffd18c);
      --ep-warning-soft: light-dark(#fff4dd, #3d2b0e);
      --ep-danger: light-dark(#a63b37, #ffaaa4);
      --ep-danger-soft: light-dark(#fff0ef, #3a1716);
      --ep-blue: light-dark(#315f87, #9bc9f0);
      --ep-blue-soft: light-dark(#eaf3fb, #142b3f);
      --ep-shadow: light-dark(0 18px 45px rgba(18, 79, 69, .10), 0 18px 45px rgba(0, 0, 0, .28));
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ep-text);
      width: 100%;
    }

    #elecpro-project-control * { box-sizing: border-box; }
    #elecpro-project-control button,
    #elecpro-project-control input,
    #elecpro-project-control select,
    #elecpro-project-control textarea { font: inherit; }
    #elecpro-project-control button { cursor: pointer; }
    #elecpro-project-control .ep-app {
      width: 100%;
      min-width: 0;
      background: var(--ep-shell);
      border: 1px solid var(--ep-line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--ep-shadow);
    }

    #elecpro-project-control .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 21px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    #elecpro-project-control .ep-layout { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 720px; position: relative; }
    #elecpro-project-control .ep-sidebar {
      background: light-dark(#f8fcfa, #0a1a15);
      border-right: 1px solid var(--ep-line);
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
      transition: transform .22s ease, padding .22s ease;
    }
    #elecpro-project-control .ep-logo-wrap {
      height: 58px;
      padding: 7px 10px;
      border-radius: 12px;
      background: #ffffff;
      display: flex;
      align-items: center;
    }
    #elecpro-project-control .ep-logo-wrap img { width: 100%; max-width: 176px; height: auto; display: block; }
    #elecpro-project-control .ep-nav { display: grid; gap: 5px; }
    #elecpro-project-control .ep-nav-button {
      border: 0;
      background: transparent;
      color: var(--ep-muted);
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 43px;
      padding: 9px 11px;
      border-radius: 11px;
      text-align: left;
      font-weight: 500;
    }
    #elecpro-project-control .ep-nav-button:hover { background: var(--ep-green-50); color: var(--ep-green-900); }
    #elecpro-project-control .ep-nav-button[aria-current="page"] { background: var(--ep-green-100); color: var(--ep-green-900); }
    #elecpro-project-control .ep-nav-icon { width: 23px; display: grid; place-items: center; flex: 0 0 23px; }
    #elecpro-project-control .ep-nav-label { min-width: 0; }
    #elecpro-project-control .ep-sidebar-foot { margin-top: auto; padding: 12px; background: var(--ep-green-50); border-radius: 13px; }
    #elecpro-project-control .ep-sidebar-foot strong { display: block; color: var(--ep-green-900); font-size: 13px; }
    #elecpro-project-control .ep-sidebar-foot span { display: block; color: var(--ep-muted); font-size: 12px; margin-top: 4px; }
    #elecpro-project-control .ep-sidebar-head { display: flex; align-items: center; gap: 8px; }
    #elecpro-project-control .ep-nav-backdrop {
      display: none;
      border: 0;
      background: rgba(7, 19, 15, .46);
    }
    #elecpro-project-control .ep-app.is-nav-collapsed .ep-layout { grid-template-columns: 72px minmax(0, 1fr); }
    #elecpro-project-control .ep-app.is-nav-collapsed .ep-sidebar { padding: 22px 10px; }
    #elecpro-project-control .ep-app.is-nav-collapsed .ep-logo-wrap,
    #elecpro-project-control .ep-app.is-nav-collapsed .ep-sidebar-foot { display: none; }
    #elecpro-project-control .ep-app.is-nav-collapsed .ep-sidebar-head { justify-content: center; }
    #elecpro-project-control .ep-app.is-nav-collapsed .ep-nav-button { justify-content: center; padding-inline: 8px; }
    #elecpro-project-control .ep-app.is-nav-collapsed .ep-nav-label { display: none; }

    #elecpro-project-control .ep-main { min-width: 0; }
    #elecpro-project-control .ep-topbar {
      min-height: 78px;
      padding: 15px 24px;
      background: var(--ep-surface);
      border-bottom: 1px solid var(--ep-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    #elecpro-project-control .ep-topbar-start { display: flex; align-items: center; gap: 12px; min-width: 0; }
    #elecpro-project-control .ep-menu-toggle,
    #elecpro-project-control .ep-sidebar-toggle {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ep-line);
      border-radius: 10px;
      background: var(--ep-surface);
      color: var(--ep-green-900);
    }
    #elecpro-project-control .ep-menu-toggle:hover,
    #elecpro-project-control .ep-sidebar-toggle:hover { background: var(--ep-green-50); }
    #elecpro-project-control .ep-menu-toggle:focus-visible,
    #elecpro-project-control .ep-sidebar-toggle:focus-visible,
    #elecpro-project-control .ep-nav-button:focus-visible { outline: 3px solid light-dark(#7dbbaa, #80d9c1); outline-offset: 2px; }
    #elecpro-project-control .ep-menu-toggle { display: none; }
    #elecpro-project-control .ep-title h1 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 500; }
    #elecpro-project-control .ep-title p { margin: 5px 0 0; color: var(--ep-muted); font-size: 12px; }
    #elecpro-project-control .ep-account { display: flex; align-items: center; gap: 10px; }
    #elecpro-project-control .ep-role-select {
      min-height: 40px;
      border: 1px solid var(--ep-line);
      background: var(--ep-surface);
      color: var(--ep-text);
      border-radius: 10px;
      padding: 8px 32px 8px 10px;
    }
    #elecpro-project-control .ep-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--ep-green-800); color: #fff; display: grid; place-items: center; font-weight: 500; }
    #elecpro-project-control .ep-content { padding: 22px 24px 28px; }

    #elecpro-project-control .ep-section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    #elecpro-project-control .ep-section-head h2 { margin: 0; font-size: 18px; font-weight: 500; }
    #elecpro-project-control .ep-section-head p { margin: 5px 0 0; color: var(--ep-muted); font-size: 13px; }
    #elecpro-project-control .ep-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    #elecpro-project-control .ep-action-primary,
    #elecpro-project-control .ep-action-secondary,
    #elecpro-project-control .ep-action-ghost {
      border-radius: 10px;
      min-height: 39px;
      padding: 8px 13px;
      font-weight: 500;
      border: 1px solid transparent;
    }
    #elecpro-project-control .ep-action-primary { background: var(--ep-green-800); color: #fff; }
    #elecpro-project-control .ep-action-primary:hover { background: var(--ep-green-900); }
    #elecpro-project-control .ep-action-secondary { background: var(--ep-surface); color: var(--ep-green-900); border-color: var(--ep-line); }
    #elecpro-project-control .ep-action-ghost { background: transparent; color: var(--ep-muted); }
    #elecpro-project-control .ep-action-ghost:hover { background: var(--ep-green-50); color: var(--ep-green-900); }

    #elecpro-project-control .ep-metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    #elecpro-project-control .ep-metric {
      background: var(--ep-surface);
      border: 1px solid var(--ep-line);
      border-radius: 15px;
      padding: 15px;
      min-width: 0;
    }
    #elecpro-project-control .ep-metric-label { color: var(--ep-muted); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
    #elecpro-project-control .ep-metric-value { margin-top: 9px; font-size: 19px; line-height: 1.15; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    #elecpro-project-control .ep-metric-note { margin-top: 7px; color: var(--ep-muted); font-size: 11px; }
    #elecpro-project-control .ep-metric-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--ep-green-700); margin-top: 3px; }
    #elecpro-project-control .ep-metric-mark.warning { background: var(--ep-warning); }
    #elecpro-project-control .ep-metric-mark.danger { background: var(--ep-danger); }

    #elecpro-project-control .ep-dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(250px, .8fr); gap: 14px; align-items: start; }
    #elecpro-project-control .ep-panel { background: var(--ep-surface); border: 1px solid var(--ep-line); border-radius: 15px; overflow: hidden; }
    #elecpro-project-control .ep-panel-head { padding: 14px 16px; border-bottom: 1px solid var(--ep-line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    #elecpro-project-control .ep-panel-head h3 { margin: 0; font-size: 14px; font-weight: 500; }
    #elecpro-project-control .ep-panel-body { padding: 15px 16px; }
    #elecpro-project-control .ep-table-wrap { overflow-x: auto; }
    #elecpro-project-control table { width: 100%; border-collapse: collapse; min-width: 650px; }
    #elecpro-project-control th { color: var(--ep-muted); font-size: 11px; font-weight: 500; text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--ep-line); white-space: nowrap; }
    #elecpro-project-control td { font-size: 12px; padding: 12px; border-bottom: 1px solid var(--ep-line); vertical-align: middle; }
    #elecpro-project-control tr:last-child td { border-bottom: 0; }
    #elecpro-project-control .ep-project-link { border: 0; padding: 0; background: transparent; color: var(--ep-green-900); font-weight: 500; text-align: left; }
    #elecpro-project-control .ep-project-link small { display: block; color: var(--ep-muted); font-weight: 400; margin-top: 3px; }
    #elecpro-project-control .ep-status { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; background: var(--ep-green-100); color: var(--ep-green-900); white-space: nowrap; }
    #elecpro-project-control .ep-status.paused { background: var(--ep-warning-soft); color: var(--ep-warning); }
    #elecpro-project-control .ep-status.finished { background: var(--ep-blue-soft); color: var(--ep-blue); }
    #elecpro-project-control .ep-status.draft,
    #elecpro-project-control .ep-status.quoted { background: light-dark(#edf0ef, #24322e); color: var(--ep-muted); }
    #elecpro-project-control .ep-status.cancelled { background: var(--ep-danger-soft); color: var(--ep-danger); }
    #elecpro-project-control .ep-progress { height: 6px; background: light-dark(#e4ece8, #213b33); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    #elecpro-project-control .ep-progress > span { display: block; height: 100%; background: var(--ep-green-700); border-radius: inherit; }

    #elecpro-project-control .ep-alert-list { display: grid; gap: 9px; }
    #elecpro-project-control .ep-alert-item { padding: 11px 12px; border-radius: 11px; background: var(--ep-green-50); display: grid; grid-template-columns: 9px minmax(0, 1fr); gap: 10px; }
    #elecpro-project-control .ep-alert-item.warning { background: var(--ep-warning-soft); }
    #elecpro-project-control .ep-alert-item.danger { background: var(--ep-danger-soft); }
    #elecpro-project-control .ep-alert-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ep-green-700); margin-top: 5px; }
    #elecpro-project-control .ep-alert-item.warning .ep-alert-dot { background: var(--ep-warning); }
    #elecpro-project-control .ep-alert-item.danger .ep-alert-dot { background: var(--ep-danger); }
    #elecpro-project-control .ep-alert-item strong { display: block; font-size: 12px; font-weight: 500; }
    #elecpro-project-control .ep-alert-item span { display: block; color: var(--ep-muted); font-size: 11px; margin-top: 3px; }
    #elecpro-project-control .ep-automation-list { display: grid; gap: 10px; }
    #elecpro-project-control .ep-automation { display: flex; gap: 10px; align-items: center; }
    #elecpro-project-control .ep-automation-toggle { width: 30px; height: 18px; border-radius: 999px; background: var(--ep-green-700); padding: 3px; flex: 0 0 auto; }
    #elecpro-project-control .ep-automation-toggle::after { content: ""; display: block; width: 12px; height: 12px; margin-left: 12px; background: #fff; border-radius: 50%; }
    #elecpro-project-control .ep-automation strong { font-size: 12px; display: block; font-weight: 500; }
    #elecpro-project-control .ep-automation span { color: var(--ep-muted); font-size: 11px; display: block; margin-top: 2px; }

    #elecpro-project-control .ep-project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    #elecpro-project-control .ep-project-tile { background: var(--ep-surface); border: 1px solid var(--ep-line); border-radius: 15px; padding: 16px; }
    #elecpro-project-control .ep-project-tile-head { display: flex; justify-content: space-between; gap: 12px; }
    #elecpro-project-control .ep-project-tile h3 { margin: 0; font-size: 15px; font-weight: 500; }
    #elecpro-project-control .ep-project-tile .ep-code { color: var(--ep-muted); font-size: 11px; margin-top: 4px; }
    #elecpro-project-control .ep-project-tile-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    #elecpro-project-control .ep-project-tile-meta span { display: block; color: var(--ep-muted); font-size: 10px; }
    #elecpro-project-control .ep-project-tile-meta strong { display: block; font-size: 12px; margin-top: 3px; font-weight: 500; overflow-wrap: anywhere; }
    #elecpro-project-control .ep-project-tile-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--ep-line); }
    #elecpro-project-control .ep-project-tile-foot span { color: var(--ep-muted); font-size: 11px; }

    #elecpro-project-control .ep-detail-hero { background: linear-gradient(135deg, var(--ep-green-900), var(--ep-green-700)); color: #fff; border-radius: 17px; padding: 18px; margin-bottom: 14px; }
    #elecpro-project-control .ep-detail-hero-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    #elecpro-project-control .ep-detail-hero h2 { margin: 6px 0 0; font-size: 20px; font-weight: 500; }
    #elecpro-project-control .ep-detail-hero p { margin: 6px 0 0; font-size: 12px; opacity: .82; }
    #elecpro-project-control .ep-detail-code { font-size: 11px; opacity: .78; }
    #elecpro-project-control .ep-detail-hero .ep-action-secondary { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); }
    #elecpro-project-control .ep-detail-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 18px; }
    #elecpro-project-control .ep-detail-metric { background: rgba(255,255,255,.11); border-radius: 11px; padding: 11px; }
    #elecpro-project-control .ep-detail-metric span { display: block; font-size: 10px; opacity: .75; }
    #elecpro-project-control .ep-detail-metric strong { display: block; margin-top: 4px; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    #elecpro-project-control .ep-tabs { display: flex; gap: 3px; overflow-x: auto; padding: 5px; background: var(--ep-surface); border: 1px solid var(--ep-line); border-radius: 12px; margin-bottom: 14px; }
    #elecpro-project-control .ep-tab { border: 0; background: transparent; color: var(--ep-muted); border-radius: 8px; padding: 8px 11px; white-space: nowrap; font-size: 12px; }
    #elecpro-project-control .ep-tab[aria-selected="true"] { color: var(--ep-green-900); background: var(--ep-green-100); font-weight: 500; }
    #elecpro-project-control .ep-two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    #elecpro-project-control .ep-info-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    #elecpro-project-control .ep-info-item span { display: block; color: var(--ep-muted); font-size: 10px; }
    #elecpro-project-control .ep-info-item strong { display: block; margin-top: 4px; font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
    #elecpro-project-control .ep-financial-bars { display: grid; gap: 13px; }
    #elecpro-project-control .ep-financial-row-head { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
    #elecpro-project-control .ep-financial-row-head span:last-child { font-variant-numeric: tabular-nums; font-weight: 500; }
    #elecpro-project-control .ep-financial-note { padding: 11px 12px; border-radius: 10px; background: var(--ep-green-50); color: var(--ep-muted); font-size: 11px; margin-top: 13px; }
    #elecpro-project-control .ep-empty { color: var(--ep-muted); text-align: center; padding: 24px 14px; font-size: 12px; }
    #elecpro-project-control .ep-back { border: 0; background: transparent; color: var(--ep-green-900); padding: 0; margin-bottom: 11px; font-weight: 500; }

    #elecpro-project-control .ep-client-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    #elecpro-project-control .ep-client-tile { background: var(--ep-surface); border: 1px solid var(--ep-line); border-radius: 14px; padding: 15px; }
    #elecpro-project-control .ep-client-avatar { width: 38px; height: 38px; display: grid; place-items: center; background: var(--ep-green-100); color: var(--ep-green-900); border-radius: 11px; font-weight: 500; }
    #elecpro-project-control .ep-client-tile h3 { margin: 11px 0 0; font-size: 14px; font-weight: 500; }
    #elecpro-project-control .ep-client-tile p { color: var(--ep-muted); font-size: 11px; margin: 4px 0 0; }
    #elecpro-project-control .ep-client-count { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--ep-line); color: var(--ep-muted); font-size: 11px; }

    #elecpro-project-control .ep-share-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
    #elecpro-project-control .ep-share-tile { background: var(--ep-surface); border: 1px solid var(--ep-line); border-radius: 14px; padding: 14px; }
    #elecpro-project-control .ep-share-tile strong { display: block; font-size: 13px; font-weight: 500; }
    #elecpro-project-control .ep-share-tile span { display: block; color: var(--ep-muted); font-size: 11px; margin-top: 4px; }
    #elecpro-project-control .ep-share-amount { margin-top: 12px !important; color: var(--ep-green-900) !important; font-size: 17px !important; font-weight: 500; font-variant-numeric: tabular-nums; }

    #elecpro-project-control .ep-quote-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    #elecpro-project-control .ep-quote-card { background: var(--ep-surface); border: 1px solid var(--ep-line); border-radius: 15px; padding: 15px; display: grid; gap: 13px; }
    #elecpro-project-control .ep-quote-card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    #elecpro-project-control .ep-quote-card h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.35; }
    #elecpro-project-control .ep-quote-code { color: var(--ep-green-800); font-size: 11px; font-weight: 600; margin-bottom: 5px; }
    #elecpro-project-control .ep-quote-card p { margin: 0; color: var(--ep-muted); font-size: 11px; line-height: 1.45; }
    #elecpro-project-control .ep-quote-card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 11px; border-top: 1px solid var(--ep-line); }
    #elecpro-project-control .ep-quote-card-meta span { display: block; color: var(--ep-muted); font-size: 10px; }
    #elecpro-project-control .ep-quote-card-meta strong { display: block; margin-top: 3px; font-size: 12px; font-weight: 500; }
    #elecpro-project-control .ep-quote-workspace { display: grid; grid-template-columns: minmax(360px, .82fr) minmax(520px, 1.18fr); gap: 14px; align-items: start; }
    #elecpro-project-control .ep-quote-workspace { display:block; }
    #elecpro-project-control .ep-editor-pane { width:100%; }

        const title = budget?'Agregar presupuesto':'Registrar gasto';
        const dateAndMethod = budget?'':field('Fecha','date','date',isoOffset(0),'required')+selectField('Medio de pago','method',['Transferencia','Efectivo','Cheque','Tarjeta empresarial','Otro'].map(x=>option(x,x)).join(''));
        openDialog(title,`<div class="ep-form-grid">${field('Categoría','category','text','','required')}${field('Valor','amount','number','','min="1" required')}${dateAndMethod}${field('Descripción / observación','note','text','','required',true)}</div>${formActions()}`,v=>{const p=state.data.projects.find(p=>p.id===projectId); const record={...v,id:uid(budget?'bu':'ex'),amount:num(v.amount)};(budget?p.budgets:p.expenses).push(record);showToast(budget?'Presupuesto actualizado.':'Gasto registrado; ganancia recalculada automáticamente.');});
      }
      function openClient() {
        openDialog('Nuevo cliente',`<div class="ep-form-grid">${field('Nombre o razón social','name','text','','required',true)}${selectField('Tipo','type',option('Empresa','Empresa')+option('Persona natural','Persona natural')+option('Propiedad horizontal','Propiedad horizontal'))}${field('Contacto','contact','text','','required')}${field('Teléfono','phone','text','','required')}${field('Correo','email','email','')}${field('Dirección','address','text','', '', true)}</div>${formActions()}`,v=>{state.data.clients.push({...v,id:uid('c')});showToast('Cliente agregado al catálogo.');});
      }
      function catalogForm(item=null) {
        const x=item||{code:'',description:'',unit:'und',unitPrice:'',category:'Material'};
        return `<div class="ep-form-grid">${field('Código','code','text',x.code,'required')}${field('Descripción','description','text',x.description,'required',true)}${field('Unidad','unit','text',x.unit,'required')}${field('Valor unitario base','unitPrice','number',x.unitPrice,'min="0" step="0.01" required')}${selectField('Categoría','category',option('Material','Material',x.category)+option('Mano de obra','Mano de obra',x.category))}</div>${formActions()}`;
      }
      function openCatalog(itemId=null) {
        const existing=itemId ? state.data.catalog.find(x=>x.id===itemId) : null;
        openDialog(existing?'Editar producto o servicio':'Nuevo producto o servicio',catalogForm(existing),v=>{
          if(!v.code.trim() || !v.description.trim() || !v.unit.trim() || v.unitPrice==='' || num(v.unitPrice)<0) { alert('Complete los campos obligatorios con un valor válido.'); return false; }
          v.code=v.code.trim(); v.description=v.description.trim(); v.unit=v.unit.trim();
          const duplicate=state.data.catalog.find(x=>normalizeText(x.code)===normalizeText(v.code) && x.id!==existing?.id);
          if(duplicate) { alert('El código ya existe.'); return false; }
          const record={...v,id:existing?.id||uid('cat'),unitPrice:num(v.unitPrice)};
          if(existing) Object.assign(existing,record); else state.data.catalog.unshift(record);
          showToast(existing?'Registro actualizado.':'Registro creado.');
        });
      }
      function supplierForm(item=null) {
        const x=item||{name:'',phone:'',email:'',website:'',description:''};
        return `<div class="ep-form-grid">${field('Nombre','name','text',x.name,'required',true)}${field('Teléfono','phone','text',x.phone)}${field('Correo','email','email',x.email)}${field('Página web','website','url',x.website)}<div class="ep-field full"><label>Descripción de lo que vende</label><textarea name="description">${escapeHtml(x.description)}</textarea></div></div>${formActions()}`;
      }
      function openSupplier(itemId=null) {
        const existing=itemId ? state.data.suppliers.find(x=>x.id===itemId) : null;
        openDialog(existing?'Editar proveedor':'Nuevo proveedor',supplierForm(existing),v=>{
          if(!v.name.trim()) { alert('El nombre es obligatorio.'); return false; }
          v.name=v.name.trim();
          const record={...v,id:existing?.id||uid('sup')}; if(existing) Object.assign(existing,record); else state.data.suppliers.unshift(record);
          showToast(existing?'Proveedor actualizado.':'Proveedor creado.');
        });
      }
      function openShare(projectId=null) {
        const isGlobal=!projectId;
        openDialog(isGlobal?'Distribución general':'Condición de distribución',`<div class="ep-form-grid">${field('Persona, gerencia o inversor','participant','text','','required',true)}${selectField('Tipo de participación','mode',option('percent','Porcentaje')+option('fixed','Valor fijo'))}${field('Valor o porcentaje','value','number','','min="0" step="0.01" required')}${isGlobal?'':selectField('Base de cálculo','basis',option('project_value','Valor total del proyecto')+option('real_profit','Utilidad real del proyecto'),true)}${selectField('Estado del pago','paid',option('false','Pendiente')+option('true','Pagado'))}${field('Fecha de pago','paidDate','date','')}</div>${formActions()}`,v=>{const record={...v,id:uid(isGlobal?'gs':'sh'),value:num(v.value),paid:v.paid==='true',basis:isGlobal?'portfolio_profit':v.basis}; if(isGlobal)state.data.globalShares.push(record);else state.data.projects.find(p=>p.id===projectId).shares.push(record);showToast('Condición de distribución registrada.');});
      }
      function exportCsv() {
        const rows=[['Cotización','Proyecto','Cliente','Estado','Valor','Pagado','Saldo','Gastos','Ganancia']];
        state.data.projects.forEach(p=>{const t=totals(p);rows.push([p.quote,p.type,client(p).name,p.status,p.value,t.paid,t.balance,t.expenses,t.profit]);});
        const csv='\ufeff'+rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
        const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); const a=document.createElement('a');a.href=url;a.download='elecpro-proyectos.csv';a.click();URL.revokeObjectURL(url);showToast('Informe compatible con Excel generado.');
      }

      root.addEventListener('click', e => {
        const target = e.target.closest('button,[data-analysis-filter]'); if (!target) return;
        if (target.hasAttribute('data-menu-toggle')) toggleNavigation();
        else if (target.hasAttribute('data-menu-close')) setNavigationOpen(false, true);
        else if (target.dataset.nav) { state.view=target.dataset.nav; state.projectTab='summary'; if (navMedia.matches) setNavigationOpen(false, true); render(); }
        else if (target.dataset.openProject) { state.selectedProjectId=target.dataset.openProject; state.view='project'; state.projectTab='summary'; render(); }
        else if (target.dataset.openQuote) { state.selectedQuoteId=target.dataset.openQuote; state.view='quote'; render(); }
        else if (target.dataset.projectTab) { state.projectTab=target.dataset.projectTab; render(); }
        else if (target.hasAttribute('data-new-quote')) openNewQuote();
        else if (target.hasAttribute('data-preview-quote')) openQuotePreview(target);
        else if (target.hasAttribute('data-close-preview')) root.querySelector('#ep-preview-dialog').close();
        else if (target.hasAttribute('data-preview-print')) window.print();
        else if (target.dataset.analysisTab) { state.analysisTab=target.dataset.analysisTab; render(); }
        else if (target.dataset.resetAnalysis) { state.analysisFilters[target.dataset.resetAnalysis]={}; render(); }
        else if (target.dataset.analysisFilter) { const [scope,key,value]=target.dataset.analysisFilter.split(':'); state.analysisFilters[scope][key]=value; render(); }
        else if (target.hasAttribute('data-add-material')) { const q=state.data.quotes.find(x=>x.id===state.selectedQuoteId);q.materials.push({id:uid('m'),code:'',description:'',category:'',catalogId:'',quantity:1,unit:'und',unitPrice:0});saveData();render(); }
        else if (target.dataset.addCatalogItem) { const q=state.data.quotes.find(x=>x.id===state.selectedQuoteId); const x=state.data.catalog.find(x=>x.id===target.dataset.addCatalogItem); if(x) { q.materials.push({id:uid('m'),catalogId:x.id,code:x.code,description:x.description,category:x.category,quantity:1,unit:x.unit,unitPrice:num(x.unitPrice)}); saveData(); render(); showToast('Ítem agregado desde el catálogo.'); } }
        else if (target.dataset.removeMaterial) { const q=state.data.quotes.find(x=>x.id===state.selectedQuoteId);q.materials=q.materials.filter(x=>x.id!==target.dataset.removeMaterial);saveData();render();showToast('Ítem eliminado de la cotización.'); }
        else if (target.dataset.convertQuote) convertQuoteToProject(target.dataset.convertQuote);
        else if (target.hasAttribute('data-new-project')) openProjectForm();
        else if (target.dataset.editProject) openProjectForm(target.dataset.editProject);
        else if (target.dataset.newPayment) openPayment(target.dataset.newPayment);
        else if (target.dataset.newExpense) openExpense(target.dataset.newExpense,false);
        else if (target.dataset.newBudget) openExpense(target.dataset.newBudget,true);
        else if (target.hasAttribute('data-new-client')) openClient();
        else if (target.hasAttribute('data-new-catalog')) openCatalog();
        else if (target.dataset.editCatalog) openCatalog(target.dataset.editCatalog);
        else if (target.dataset.deleteCatalog) { const x=state.data.catalog.find(x=>x.id===target.dataset.deleteCatalog); if(x && confirm(`¿Eliminar “${x.code}”?`)) { state.data.catalog=state.data.catalog.filter(x=>x.id!==target.dataset.deleteCatalog);saveData();render();showToast('Registro eliminado.'); } }
        else if (target.hasAttribute('data-new-supplier')) openSupplier();
        else if (target.dataset.editSupplier) openSupplier(target.dataset.editSupplier);
        else if (target.dataset.deleteSupplier) { const x=state.data.suppliers.find(x=>x.id===target.dataset.deleteSupplier); if(x && confirm(`¿Eliminar “${x.name}”?`)) { state.data.suppliers=state.data.suppliers.filter(x=>x.id!==target.dataset.deleteSupplier);saveData();render();showToast('Proveedor eliminado.'); } }
        else if (target.dataset.newShare) openShare(target.dataset.newShare);
        else if (target.hasAttribute('data-new-global-share')) openShare();
        else if (target.hasAttribute('data-export')) exportCsv();
        else if (target.hasAttribute('data-print') || target.hasAttribute('data-print-quote')) window.print();
        else if (target.hasAttribute('data-close-dialog')) root.querySelector('#ep-dialog').close();
      });
      root.addEventListener('change', e => {
        if(e.target.dataset.analysisSelect) { const [scope,key]=e.target.dataset.analysisSelect.split(':'); state.analysisFilters[scope][key]=e.target.value; render(); return; }
        const q=state.data.quotes.find(x=>x.id===state.selectedQuoteId);
        if (e.target.dataset.quoteField && q) q[e.target.dataset.quoteField]=e.target.value;
        else if (e.target.dataset.quoteEconomic && q) {
          if(e.target.dataset.quoteEconomic==='materialIncreasePct' && num(e.target.value)>0 && q.materials.some(m=>!m.category)) { alert('Elija la categoría de los ítems sin clasificar antes de aplicar un incremento.'); e.target.value=0; q.materialIncreasePct=0; }
          else q[e.target.dataset.quoteEconomic]=num(e.target.value);
        }
        else if (e.target.dataset.materialField && q) {
          const item=q.materials.find(x=>x.id===e.target.dataset.materialId);
          if(item) item[e.target.dataset.materialField]=['quantity','unitPrice'].includes(e.target.dataset.materialField)?num(e.target.value):e.target.value;
        } else if (e.target.dataset.companyField) state.data.company[e.target.dataset.companyField]=e.target.value;
        else return;
        saveData();render();showToast('Cambios guardados y vista previa actualizada.');
      });
      root.addEventListener('input', e => {
        const refreshSearch=attr=>{ render(); const input=root.querySelector(`[${attr}]`); if(input) { input.focus(); input.setSelectionRange(input.value.length,input.value.length); } };
        if(e.target.hasAttribute('data-catalog-search')) { state.catalogSearch=e.target.value; refreshSearch('data-catalog-search'); }
        else if(e.target.hasAttribute('data-supplier-search')) { state.supplierSearch=e.target.value; refreshSearch('data-supplier-search'); }
        else if(e.target.hasAttribute('data-quote-catalog-search')) { state.quoteCatalogSearch=e.target.value; refreshSearch('data-quote-catalog-search'); }
        else if(e.target.dataset.quoteField || e.target.dataset.quoteEconomic || e.target.dataset.materialField || e.target.dataset.companyField) { syncQuoteFromEditor(); }
      });
      root.addEventListener('change', e => { if(e.target.hasAttribute('data-catalog-category')) { state.catalogCategory=e.target.value; render(); } });
      root.addEventListener('keydown', e => {
        if ((e.key==='Enter' || e.key===' ') && e.target.dataset.analysisFilter) { e.preventDefault(); e.target.click(); return; }
        if (e.key === 'Escape' && navMedia.matches && navigation.open) {
          e.preventDefault();
          setNavigationOpen(false, true);
        }
      });
      navMedia.addEventListener('change', () => {
        navigation.open = false;
        updateNavigation();
      });
      root.querySelector('#ep-role').addEventListener('change', e => { state.role=e.target.value; render(); showToast(`Vista de ${state.role} activada.`); });
      root.querySelector('#ep-preview-dialog').addEventListener('close', () => { const opener=state.previewOpener; state.previewOpener=null; if(opener && document.contains(opener)) opener.focus(); });
      render();
    })();
  </script>
</div>
</body>
</html>
